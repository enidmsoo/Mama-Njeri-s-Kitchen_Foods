<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal CSS Example</title>
  <!-- INTERNAL CSS is written inside the style element in the head. -->
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #fff4e5;
      color: #263344;
    }
    .example-box {
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 12px;
      background: white;
      border: 2px solid #edbd49;
      text-align: center;
    }
    h1 { color: #df5a43; }
  </style>
</head>
<body>
  <div class="example-box">
    <h1>Internal CSS Example</h1>
    <p>This page demonstrates CSS written inside the HTML file, within the head section.</p>
    <p>Open <strong>index.html</strong> to view the complete Kenyan food website.</p>
  </div>
</body>
</html>
